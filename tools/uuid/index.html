<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="基于浏览器加密级随机数生成器批量生成 UUID v4、时间有序 UUID v7、ULID 与安全随机字符串。">
  <title>UUID / 随机 ID 生成 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">UUID / 随机 ID 生成</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">⚿</div>
      <div class="page-head-text">
        <h1>UUID / 随机 ID 生成</h1>
        <p>基于浏览器加密级随机数生成器批量生成 UUID v4、时间有序 UUID v7、ULID 与安全随机字符串。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <select id="idType" class="tool-select">
          <option value="uuidv4">UUID v4 (标准随机)</option>
          <option value="uuidv7">UUID v7 (时间有序)</option>
          <option value="ulid">ULID (26位字典序)</option>
          <option value="nanoid">NanoID (21位URL安全)</option>
          <option value="hex32">32位随机 Hex</option>
        </select>
        <label style="font-size:13px;">数量: <input id="idCount" type="number" class="tool-input" value="10" min="1" max="500" style="width:76px;"></label>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="optUpper"> 大写</label>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="optNoDash"> 去掉横杠 (-)</label>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="optQuotes"> 加双引号</label>
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="generateIds()">立即生成</button>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="copyIds()">复制全部</button>
        <button class="mdui-btn mdui-ripple" onclick="downloadIds()">下载 TXT</button>
      </div>

      <textarea id="uuidOutput" class="tool-textarea" spellcheck="false" readonly placeholder="生成的 ID 列表将显示在这里"></textarea>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/uuid.js"></script>
</body>
</html>
