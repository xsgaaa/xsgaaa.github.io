<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持 JSON 与 Java POJO 实体类双向转换，自动识别嵌套类、List 泛型及包装类型（Integer / Double / Boolean / String）。">
  <title>JSON ↔ Java 实体类转换 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">JSON ↔ Java 实体类</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">POJO</div>
      <div class="page-head-text">
        <h1>JSON ↔ Java 实体类转换</h1>
        <p>支持 JSON 与 Java POJO 实体类双向转换，自动识别嵌套类、List 泛型及包装类型（Integer / Double / Boolean / String）。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <label style="font-size:13px;">根类名: <input id="rootClassName" type="text" class="tool-input" value="Root" style="width:120px;"></label>
        <button id="jsonToJavaBtn" class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple">JSON → Java</button>
        <button id="javaToJsonBtn" class="mdui-btn mdui-btn-raised mdui-ripple">Java → JSON</button>
        <div class="tool-toolbar-spacer"></div>
        <button id="loadSampleBtn" class="mdui-btn mdui-ripple">示例</button>
        <button id="clearAllBtn" class="mdui-btn mdui-ripple">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>JSON 数据</span>
            <button id="copyJsonBtn" class="mdui-btn mdui-btn-dense mdui-ripple">复制 JSON</button>
          </div>
          <textarea id="jsonInput" class="tool-textarea" style="min-height:420px;" spellcheck="false" placeholder='{"name":"Tom","age":18,"score":99.5,"active":true,"tags":["a","b"],"profile":{"email":"a@b.com"}}'></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>Java 实体类</span>
            <button id="copyJavaBtn" class="mdui-btn mdui-btn-dense mdui-ripple">复制 Java</button>
          </div>
          <textarea id="javaInput" class="tool-textarea" style="min-height:420px;" spellcheck="false" placeholder="public class Root {&#10;    private String name;&#10;    private Integer age;&#10;}"></textarea>
        </div>
      </div>

      <div id="jsonJavaStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/json-java.js"></script>
</body>
</html>
