<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="纯浏览器本地 Canvas 压缩与格式转换（WebP / JPEG / PNG），支持调整质量与最大尺寸，图片不上传服务器。">
  <title>图片压缩与转换 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">图片压缩与转换</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">▣</div>
      <div class="page-head-text">
        <h1>图片压缩与转换</h1>
        <p>纯浏览器本地 Canvas 压缩与格式转换（WebP / JPEG / PNG），支持调整质量与最大尺寸，图片不上传服务器。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <label class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" style="cursor:pointer;">
          选择图片
          <input id="imgFile" type="file" accept="image/*" style="display:none;">
        </label>
        <select id="outFormat" class="tool-select" onchange="compressImage()">
          <option value="image/webp">输出 WebP (推荐)</option>
          <option value="image/jpeg">输出 JPEG</option>
          <option value="image/png">输出 PNG</option>
        </select>
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;">
          质量: <input id="qualityRange" type="range" min="0.1" max="1" step="0.05" value="0.8" oninput="updateQualityLabel()" onchange="compressImage()">
          <span id="qualityVal" class="tool-pane-meta">80%</span>
        </label>
        <label style="font-size:13px;">最大宽/高(px): <input id="maxDim" type="number" class="tool-input" value="0" min="0" max="8000" style="width:80px;" placeholder="0=不限" onchange="compressImage()"></label>
        <div class="tool-toolbar-spacer"></div>
        <button id="downloadBtn" class="mdui-btn mdui-btn-raised mdui-ripple" onclick="downloadCompressed()" disabled>下载压缩图</button>
      </div>

      <div id="dropZone" style="border:2px dashed rgba(0,150,136,0.4);border-radius:6px;padding:18px;text-align:center;margin-bottom:16px;font-size:13px;opacity:0.85;">
        可将图片拖拽到此区域，或点击上方「选择图片」
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>原图</span>
            <span id="origMeta" class="tool-pane-meta">-</span>
          </div>
          <div class="mermaid-preview" style="min-height:280px;align-items:center;">
            <img id="origPreview" style="max-width:100%;max-height:420px;display:none;" alt="原图预览">
          </div>
        </div>
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>压缩结果</span>
            <span id="compMeta" class="tool-pane-meta">-</span>
          </div>
          <div class="mermaid-preview" style="min-height:280px;align-items:center;">
            <img id="compPreview" style="max-width:100%;max-height:420px;display:none;" alt="压缩预览">
          </div>
        </div>
      </div>

      <div id="imgStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/image.js"></script>
</body>
</html>
