<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持 HEX / RGB / HSL 实时互转、取色器同步，以及前景色与背景色的 WCAG 2.1 可访问性对比度计算。">
  <title>颜色转换与对比度检查 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">颜色转换与对比度</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">◐</div>
      <div class="page-head-text">
        <h1>颜色转换与 WCAG 对比度检查</h1>
        <p>支持 HEX / RGB / HSL 实时互转、取色器同步，以及前景色与背景色的 WCAG 2.1 可访问性对比度计算。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header"><span>主色值转换</span></div>
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
            <input id="colorPicker" type="color" value="#0284c7" style="width:54px; height:42px; border:none; background:none; cursor:pointer;">
            <input id="hexInput" type="text" class="tool-input" value="#0284c7" placeholder="#0284c7" style="flex:1; font-family:monospace;">
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyVal('hexInput')">复制</button>
          </div>
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
            <span style="width:54px; font-size:12px; color:var(--tech-text-muted);">RGB</span>
            <input id="rgbInput" type="text" class="tool-input" value="rgb(2, 132, 199)" style="flex:1; font-family:monospace;">
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyVal('rgbInput')">复制</button>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="width:54px; font-size:12px; color:var(--tech-text-muted);">HSL</span>
            <input id="hslInput" type="text" class="tool-input" value="hsl(200, 98%, 39%)" style="flex:1; font-family:monospace;">
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyVal('hslInput')">复制</button>
          </div>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>WCAG 对比度检测</span>
            <span id="contrastRatioBadge" class="tool-badge is-ok">对比度 4.1:1</span>
          </div>
          <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
            <label style="display:inline-flex; align-items:center; gap:6px; font-size:13px;">
              前景色 <input id="fgPicker" type="color" value="#ffffff">
            </label>
            <label style="display:inline-flex; align-items:center; gap:6px; font-size:13px;">
              背景色 <input id="bgPicker" type="color" value="#0284c7">
            </label>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="syncFgToMain()">同步主色为背景</button>
          </div>
          <div id="contrastPreview" class="color-preview-box" style="background:#0284c7; color:#ffffff;">
            <div style="font-size:18px; font-weight:700;">大号加粗文本预览 (18px+)</div>
            <div style="font-size:14px;">正文文本可读性预览：The quick brown fox jumps over the lazy dog.</div>
          </div>
          <div id="wcagBadges" class="tool-meta-bar" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/color.js"></script>
</body>
</html>
