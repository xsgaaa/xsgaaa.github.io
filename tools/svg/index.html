<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="上传 SVG 文件或直接粘贴 SVG 代码，自定义输出尺寸、透明度、JPG 背景色与质量，纯浏览器本地转换下载。">
  <title>SVG 转 PNG / JPG - 开发者工具箱</title>
  <style>
    .svg-preview-box {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      border: 1px dashed var(--tech-border-subtle);
      border-radius: 10px;
      background-color: var(--tech-code-bg);
      background-image: linear-gradient(45deg, rgba(148,163,184,0.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(148,163,184,0.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(148,163,184,0.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(148,163,184,0.12) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .svg-preview-box canvas {
      max-width: 100%;
      max-height: 340px;
      border: 1px solid var(--tech-border-subtle);
      border-radius: 6px;
      display: none;
    }
    .svg-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
  </style>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">SVG 转 PNG / JPG</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">◈</div>
      <div class="page-head-text">
        <h1>SVG 转 PNG / JPG</h1>
        <p>上传 SVG 文件或直接粘贴 SVG 代码，自定义输出尺寸、透明度、JPG 背景色与质量，纯浏览器本地转换下载。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <label class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" style="cursor:pointer;">
          选择 SVG 文件
          <input type="file" id="svgFile" accept=".svg,image/svg+xml" style="display:none;">
        </label>
        <button id="generateBtn" class="mdui-btn mdui-btn-raised mdui-ripple">生成预览</button>
        <button id="downloadPng" class="mdui-btn mdui-btn-raised mdui-ripple" disabled>下载 PNG</button>
        <button id="downloadJpg" class="mdui-btn mdui-btn-raised mdui-ripple" disabled>下载 JPG</button>
        <div class="tool-toolbar-spacer"></div>
        <button id="loadSampleBtn" class="mdui-btn mdui-ripple">示例</button>
        <button id="clearSvgCode" class="mdui-btn mdui-ripple">清空</button>
      </div>

      <div class="svg-options-grid">
        <div class="tool-kv-item">
          <div class="tool-kv-label">输出宽度 (px)</div>
          <input type="number" id="widthInput" class="tool-input" min="1" max="5000" value="800" style="width:100%;">
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">输出高度 (px)</div>
          <input type="number" id="heightInput" class="tool-input" min="1" max="5000" value="600" style="width:100%;">
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">JPG 质量: <span id="qualityValue">90%</span></div>
          <input type="range" id="qualityRange" min="10" max="100" value="90" style="width:100%;">
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">透明度 (PNG): <span id="transparencyValue">100%</span></div>
          <input type="range" id="transparencyRange" min="0" max="100" value="100" style="width:100%;">
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">JPG 背景色 &amp; 比例</div>
          <div style="display:flex;align-items:center;gap:12px;">
            <input type="color" id="backgroundInput" value="#ffffff" style="width:42px;height:32px;border:none;background:none;cursor:pointer;">
            <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="maintainAspectRatio" checked> 保持原始比例</label>
          </div>
        </div>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>SVG 代码输入</span>
            <span id="fileMeta" class="tool-pane-meta">等待输入</span>
          </div>
          <textarea id="svgCode" class="tool-textarea" style="min-height:360px;" spellcheck="false" placeholder="在此粘贴 SVG 代码，例如：<svg xmlns='http://www.w3.org/2000/svg' ...>...</svg>"></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>渲染预览</span>
            <span id="previewMeta" class="tool-pane-meta">-</span>
          </div>
          <div class="svg-preview-box">
            <canvas id="canvas"></canvas>
            <span id="previewHint" class="tool-pane-meta">选择 SVG 文件或粘贴代码后点击「生成预览」</span>
          </div>
        </div>
      </div>

      <div id="svgStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/svg.js"></script>
</body>
</html>
