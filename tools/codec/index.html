<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="Base64、URL、Unicode、HTML 实体编解码，JWT Token 本地解析，以及 MD5 / SHA 摘要计算。">
  <title>编解码与加密哈希 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">编解码与加密哈希</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">#</div>
      <div class="page-head-text">
        <h1>编解码与加密哈希</h1>
        <p>Base64、URL、Unicode、HTML 实体编解码，JWT Token 本地解析，以及 MD5 / SHA 摘要计算。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="b64Encode()">Base64 编码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="b64Decode()">Base64 解码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="urlEnc()">URL 编码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="urlDec()">URL 解码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="unicodeEnc()">Unicode 编码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="unicodeDec()">Unicode 解码</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="htmlEnc()">HTML 转义</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="htmlDec()">HTML 反转义</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="decodeJwt()">解析 JWT</button>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="swapIO()">互换</button>
        <button class="mdui-btn mdui-ripple" onclick="clearAll()">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>输入内容</span>
            <label style="font-weight:normal;font-size:12px;cursor:pointer;">
              <input type="checkbox" id="urlSafeB64"> URL-Safe Base64
            </label>
          </div>
          <textarea id="codecInput" class="tool-textarea" spellcheck="false" placeholder="输入文本、Base64、URL 参数、Unicode 或 JWT Token..."></textarea>
        </div>
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>输出结果</span>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyOutput()">复制结果</button>
          </div>
          <textarea id="codecOutput" class="tool-textarea" spellcheck="false" readonly placeholder="结果将显示在这里"></textarea>
        </div>
      </div>

      <div id="codecStatus" class="tool-status"></div>
    </div>

    <div class="mdui-card tool-panel">
      <div class="tool-pane-header" style="margin-bottom:12px;">
        <span style="font-size:16px;">摘要哈希计算 (实时计算上方输入内容)</span>
        <label style="font-weight:normal;font-size:12px;cursor:pointer;">
          <input type="checkbox" id="hashUpper" onchange="computeHashes()"> 大写输出
        </label>
      </div>
      <div class="tool-kv-grid">
        <div class="tool-kv-item">
          <div class="tool-kv-label">MD5 (128-bit) <button class="mdui-btn mdui-btn-dense" style="float:right;min-width:0;padding:0 6px;height:20px;line-height:20px;" onclick="copyHash('hashMd5')">复制</button></div>
          <div id="hashMd5" class="tool-kv-value">-</div>
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">SHA-1 (160-bit) <button class="mdui-btn mdui-btn-dense" style="float:right;min-width:0;padding:0 6px;height:20px;line-height:20px;" onclick="copyHash('hashSha1')">复制</button></div>
          <div id="hashSha1" class="tool-kv-value">-</div>
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">SHA-256 (256-bit) <button class="mdui-btn mdui-btn-dense" style="float:right;min-width:0;padding:0 6px;height:20px;line-height:20px;" onclick="copyHash('hashSha256')">复制</button></div>
          <div id="hashSha256" class="tool-kv-value">-</div>
        </div>
        <div class="tool-kv-item">
          <div class="tool-kv-label">SHA-512 (512-bit) <button class="mdui-btn mdui-btn-dense" style="float:right;min-width:0;padding:0 6px;height:20px;line-height:20px;" onclick="copyHash('hashSha512')">复制</button></div>
          <div id="hashSha512" class="tool-kv-value">-</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/codec.js"></script>
</body>
</html>
