<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="逐行对比两段文本的增删差异，支持 JSON 自动排序格式化后对比。">
  <title>文本 / JSON 对比 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">文本 / JSON 对比</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">±</div>
      <div class="page-head-text">
        <h1>文本 / JSON 对比</h1>
        <p>逐行对比两段文本的增删差异，支持 JSON 自动排序格式化后对比。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="runDiff()">开始对比</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="formatBothJson()">格式化 JSON 后对比</button>
        <label style="font-size:13px;cursor:pointer;margin-left:8px;">
          <input type="checkbox" id="ignoreTrim" onchange="runDiff()"> 忽略行首尾空白
        </label>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="loadSample()">示例</button>
        <button class="mdui-btn mdui-ripple" onclick="clearAll()">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header"><span>原文本 (A)</span></div>
          <textarea id="diffA" class="tool-textarea" style="min-height:220px;" spellcheck="false" placeholder="粘贴原文本或 JSON..."></textarea>
        </div>
        <div class="tool-pane">
          <div class="tool-pane-header"><span>新文本 (B)</span></div>
          <textarea id="diffB" class="tool-textarea" style="min-height:220px;" spellcheck="false" placeholder="粘贴新文本或 JSON..."></textarea>
        </div>
      </div>

      <div id="diffStatus" class="tool-status"></div>

      <div style="margin-top:16px;">
        <div class="tool-pane-header">
          <span>对比结果</span>
          <span id="diffStats" class="tool-pane-meta"></span>
        </div>
        <div id="diffOutput" class="diff-output"></div>
      </div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/diff.js"></script>
</body>
</html>
