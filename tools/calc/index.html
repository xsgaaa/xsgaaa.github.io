<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持角度/弧度切换、三角函数、对数、阶乘、幂运算与表达式键盘输入，自动保存本地计算历史。">
  <title>科学计算器 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">科学计算器</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">∑</div>
      <div class="page-head-text">
        <h1>科学计算器</h1>
        <p>支持角度/弧度切换、三角函数、对数、阶乘、幂运算与表达式键盘输入，自动保存本地计算历史。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button id="angleModeBtn" class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="toggleAngleMode()">角度制: DEG</button>
        <button class="mdui-btn mdui-ripple" onclick="copyResult()">复制结果</button>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="insertToken('ans')">ANS</button>
        <button class="mdui-btn mdui-ripple" onclick="clearCalc()">AC 清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="calc-display">
            <input id="calcExpr" class="calc-expr-input" type="text" spellcheck="false" placeholder="输入表达式，如 sin(30) + log(100) * 2^3" autocomplete="off">
            <div id="calcResult" class="calc-result-val">0</div>
          </div>

          <div id="calcExtraMeta" class="tool-meta-bar" style="margin-bottom:12px;"></div>

          <div class="calc-grid">
            <button class="calc-btn is-op" onclick="insertToken('sin(')">sin</button>
            <button class="calc-btn is-op" onclick="insertToken('cos(')">cos</button>
            <button class="calc-btn is-op" onclick="insertToken('tan(')">tan</button>
            <button class="calc-btn is-op" onclick="insertToken('ln(')">ln</button>
            <button class="calc-btn is-op" onclick="insertToken('log(')">log10</button>

            <button class="calc-btn is-op" onclick="insertToken('asin(')">asin</button>
            <button class="calc-btn is-op" onclick="insertToken('acos(')">acos</button>
            <button class="calc-btn is-op" onclick="insertToken('atan(')">atan</button>
            <button class="calc-btn is-op" onclick="insertToken('sqrt(')">√</button>
            <button class="calc-btn is-op" onclick="insertToken('^')">x^y</button>

            <button class="calc-btn is-op" onclick="insertToken('pi')">π</button>
            <button class="calc-btn is-op" onclick="insertToken('e')">e</button>
            <button class="calc-btn is-op" onclick="insertToken('(')">(</button>
            <button class="calc-btn is-op" onclick="insertToken(')')">)</button>
            <button class="calc-btn is-op" onclick="backspaceCalc()">⌫</button>

            <button class="calc-btn" onclick="insertToken('7')">7</button>
            <button class="calc-btn" onclick="insertToken('8')">8</button>
            <button class="calc-btn" onclick="insertToken('9')">9</button>
            <button class="calc-btn is-op" onclick="insertToken('/')">÷</button>
            <button class="calc-btn is-op" onclick="insertToken('%')">%</button>

            <button class="calc-btn" onclick="insertToken('4')">4</button>
            <button class="calc-btn" onclick="insertToken('5')">5</button>
            <button class="calc-btn" onclick="insertToken('6')">6</button>
            <button class="calc-btn is-op" onclick="insertToken('*')">×</button>
            <button class="calc-btn is-op" onclick="insertToken('!')">n!</button>

            <button class="calc-btn" onclick="insertToken('1')">1</button>
            <button class="calc-btn" onclick="insertToken('2')">2</button>
            <button class="calc-btn" onclick="insertToken('3')">3</button>
            <button class="calc-btn is-op" onclick="insertToken('-')">−</button>
            <button class="calc-btn is-op" onclick="insertToken('^2')">x²</button>

            <button class="calc-btn" onclick="insertToken('0')">0</button>
            <button class="calc-btn" onclick="insertToken('.')">.</button>
            <button class="calc-btn is-op" onclick="insertToken('abs(')">|x|</button>
            <button class="calc-btn is-op" onclick="insertToken('+')">+</button>
            <button class="calc-btn is-eq" onclick="evaluateAndSave()">=</button>
          </div>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>计算历史（点击回填）</span>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="clearHistory()">清空历史</button>
          </div>
          <ul id="calcHistory" class="calc-history-list"></ul>
        </div>
      </div>

      <div id="calcStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/calc.js"></script>
</body>
</html>
