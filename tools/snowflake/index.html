<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="基于 Twitter Snowflake 算法生成 64 位与 32 位分布式唯一 ID，支持自定义数据中心/机器节点、批量生成与二进制位段解析。">
  <title>Snowflake ID 生成器 - 开发者工具箱</title>
  <style>
    .sf-result-box {
      padding: 16px;
      border: 1px solid var(--tech-border-subtle);
      border-radius: 10px;
      background: var(--tech-code-bg);
      margin-top: 14px;
    }
    .sf-id-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--tech-accent);
      word-break: break-all;
      margin: 8px 0;
    }
    .sf-bit-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
    }
    .sf-bit-ts { background: rgba(2, 132, 199, 0.16); color: #0284c7; }
    .sf-bit-dc { background: rgba(16, 185, 129, 0.16); color: #059669; }
    .sf-bit-wk { background: rgba(124, 58, 237, 0.16); color: #7c3aed; }
    .sf-bit-seq { background: rgba(245, 158, 11, 0.18); color: #d97706; }
    body.mdui-theme-layout-dark .sf-bit-ts { color: #38bdf8; }
    body.mdui-theme-layout-dark .sf-bit-dc { color: #34d399; }
    body.mdui-theme-layout-dark .sf-bit-wk { color: #c084fc; }
    body.mdui-theme-layout-dark .sf-bit-seq { color: #fbbf24; }
    .sf-history-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--tech-border-subtle);
      border-radius: 10px;
      background: var(--tech-code-bg);
    }
    .sf-history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--tech-border-subtle);
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .sf-history-item:last-child { border-bottom: none; }
    .sf-history-item:hover { background: rgba(2, 132, 199, 0.08); }
  </style>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">Snowflake ID 生成器</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">❄</div>
      <div class="page-head-text">
        <h1>Snowflake ID 生成器</h1>
        <p>基于 Twitter Snowflake 算法生成 64 位与 32 位分布式唯一 ID，支持自定义数据中心/机器节点、批量生成与二进制位段解析。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <label style="font-size:13px;">机器 ID (0-31): <input id="machineId" type="number" class="tool-input" min="0" max="31" value="1" style="width:76px;"></label>
        <label style="font-size:13px;">数据中心 ID (0-31): <input id="datacenterId" type="number" class="tool-input" min="0" max="31" value="1" style="width:76px;"></label>
        <button id="generateBtn" class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple">生成 64 位 ID</button>
        <button id="generate32Btn" class="mdui-btn mdui-btn-raised mdui-ripple">生成 32 位 ID</button>
        <button id="generateBatchBtn" class="mdui-btn mdui-ripple">批量 64 位 (10个)</button>
        <button id="generateBatch32Btn" class="mdui-btn mdui-ripple">批量 32 位 (10个)</button>
        <div class="tool-toolbar-spacer"></div>
        <button id="copyBtn" class="mdui-btn mdui-ripple">复制当前 ID</button>
        <button id="copyBatchBtn" class="mdui-btn mdui-ripple">复制全部历史</button>
      </div>

      <div class="sf-result-box">
        <div class="tool-pane-header">
          <span>当前生成的 ID</span>
          <span id="idTypeBadge" class="tool-pane-meta">等待生成</span>
        </div>
        <div id="result" class="sf-id-display">点击上方按钮生成 ID</div>
        <div id="idDetails" style="display:none;margin-top:12px;">
          <div class="tool-kv-grid">
            <div class="tool-kv-item" style="grid-column: 1 / -1;">
              <div class="tool-kv-label">二进制位段分布</div>
              <div class="tool-kv-value" id="binaryRepresentation"></div>
            </div>
            <div class="tool-kv-item">
              <div class="tool-kv-label">时间戳</div>
              <div class="tool-kv-value" id="timestampInfo"></div>
            </div>
            <div class="tool-kv-item">
              <div class="tool-kv-label">节点信息</div>
              <div class="tool-kv-value" id="machineInfo"></div>
            </div>
            <div class="tool-kv-item">
              <div class="tool-kv-label">序列号</div>
              <div class="tool-kv-value" id="sequenceInfo"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="snowflakeStatus" class="tool-status"></div>

      <div style="margin-top:20px;">
        <div class="tool-pane-header">
          <span>生成历史（最多保留 50 条，点击查看位段详情）</span>
          <button id="clearHistoryBtn" class="mdui-btn mdui-btn-dense mdui-ripple">清空历史</button>
        </div>
        <div id="historyContainer" class="sf-history-list">
          <div style="padding:18px;text-align:center;color:var(--tech-text-muted);font-size:13px;">暂无生成历史</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/snowflake.js"></script>
</body>
</html>
