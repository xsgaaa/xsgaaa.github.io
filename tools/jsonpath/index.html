<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="实时通过 JSONPath 表达式提取 JSON 数据并查看精确命中路径，支持递归查找 (..)、切片、通配符与条件过滤。">
  <title>JSONPath 定位 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">JSONPath 定位</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">⌖</div>
      <div class="page-head-text">
        <h1>JSONPath 定位</h1>
        <p>实时通过 JSONPath 表达式提取 JSON 数据并查看精确命中路径，支持递归查找 (..)、切片、通配符与条件过滤。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <input id="jpExpr" class="tool-input" style="flex:1;min-width:240px;" value="$.store.book[?(@.price < 10)].title" placeholder="输入 JSONPath，例如 $.store.book[*].author">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="runJsonPath()">执行查询</button>
        <button class="mdui-btn mdui-ripple" onclick="loadSample()">示例</button>
      </div>

      <div class="tool-toolbar">
        <span style="font-size:13px;opacity:.75;">快捷语法:</span>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$.store.book[*].author')">所有作者</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$..author')">递归找 author</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$.store.book[-1]')">最后一本书</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$.store.book[0:2]')">切片 0:2</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$.store.book[?(@.price < 10)].title')">价格 &lt; 10</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="setExpr('$..price')">所有价格</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header"><span>输入 JSON</span></div>
          <textarea id="jpJson" class="tool-textarea" spellcheck="false"></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <div>
              <button id="tabValBtn" class="mdui-btn mdui-btn-dense mdui-color-theme" onclick="switchOut('val')">匹配值</button>
              <button id="tabPathBtn" class="mdui-btn mdui-btn-dense" onclick="switchOut('path')">命中路径</button>
            </div>
            <div>
              <span id="jpCount" class="tool-pane-meta" style="margin-right:8px;">0 条命中</span>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyResult()">复制</button>
            </div>
          </div>
          <textarea id="jpValOut" class="tool-textarea" spellcheck="false" readonly></textarea>
          <textarea id="jpPathOut" class="tool-textarea" spellcheck="false" readonly style="display:none;"></textarea>
        </div>
      </div>

      <div id="jpStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/jsonpath.js"></script>
</body>
</html>
