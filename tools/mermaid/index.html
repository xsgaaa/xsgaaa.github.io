<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="实时渲染流程图、时序图、类图、状态图、ER 图、甘特图、饼图与思维导图，支持拖拽分隔、滚轮缩放平移及高清导出 SVG / PNG / JPG。">
  <title>Mermaid 图表渲染 - 开发者工具箱</title>
  <style>
    .mermaid-workbench {
      display: flex;
      min-height: 500px;
      border: 1px solid var(--tech-border-subtle);
      border-radius: 10px;
      overflow: hidden;
      background: var(--tech-surface-solid);
    }
    .mermaid-editor-pane {
      width: 42%;
      min-width: 240px;
      max-width: 75%;
      display: flex;
      flex-direction: column;
      background: var(--tech-code-bg);
    }
    .mermaid-editor-pane .tool-pane-header {
      padding: 8px 12px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--tech-border-subtle);
    }
    .mermaid-editor-pane textarea {
      flex: 1;
      border: none;
      border-radius: 0;
      min-height: 450px;
      resize: none;
    }
    .mermaid-resizer {
      width: 6px;
      cursor: col-resize;
      background: var(--tech-border-subtle);
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .mermaid-resizer:hover, .mermaid-resizer.is-dragging {
      background: var(--tech-accent);
    }
    .mermaid-preview-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .mermaid-preview-pane .tool-pane-header {
      padding: 8px 12px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--tech-border-subtle);
    }
    .mermaid-canvas {
      position: relative;
      flex: 1;
      min-height: 450px;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(var(--tech-border-subtle) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .mermaid-canvas.is-dragging { cursor: grabbing; }
    .mermaid-stage {
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }
    .mermaid-canvas.is-dragging .mermaid-stage { transition: none; }
    .mermaid-zoom-badge {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--tech-surface);
      border: 1px solid var(--tech-border-subtle);
      color: var(--tech-text-muted);
      pointer-events: none;
    }
    @media (max-width: 900px) {
      .mermaid-workbench { flex-direction: column; }
      .mermaid-editor-pane { width: 100% !important; max-width: 100%; }
      .mermaid-editor-pane textarea { min-height: 240px; }
      .mermaid-resizer { display: none; }
      .mermaid-canvas { min-height: 360px; }
    }
  </style>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">Mermaid 图表渲染</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">❖</div>
      <div class="page-head-text">
        <h1>Mermaid 图表渲染</h1>
        <p>实时渲染流程图、时序图、类图、状态图、ER 图、甘特图、饼图与思维导图，支持拖拽分隔、滚轮缩放平移及高清导出 SVG / PNG / JPG。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="renderMermaid()">立即渲染</button>
        <select id="themeSelect" class="tool-select" onchange="renderMermaid()" title="图表主题">
          <option value="site" selected>站点主题</option>
          <option value="default">默认主题</option>
          <option value="dark">暗黑主题</option>
          <option value="forest">森林主题</option>
          <option value="neutral">中性主题</option>
        </select>
        <select id="templateSelect" class="tool-select" onchange="applyTemplate(this.value)">
          <option value="">选择示例模板...</option>
          <option value="flowchart">流程图 (Flowchart)</option>
          <option value="sequence">时序图 (Sequence)</option>
          <option value="class">类图 (Class)</option>
          <option value="state">状态图 (State)</option>
          <option value="er">ER 实体关系图</option>
          <option value="gantt">甘特图 (Gantt)</option>
          <option value="mindmap">思维导图 (Mindmap)</option>
          <option value="pie">饼图 (Pie)</option>
        </select>
        <select id="exportScaleSelect" class="tool-select" title="位图导出分辨率倍率">
          <option value="1">1x 标清</option>
          <option value="2" selected>2x 高清</option>
          <option value="3">3x 超清</option>
          <option value="4">4x 极清</option>
        </select>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="zoomBy(1 / 1.25)">缩小</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="fitToScreen()">适应画布</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="resetZoom()">100%</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="zoomBy(1.25)">放大</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="exportSvg()">导出 SVG</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="exportBitmap('png')">导出 PNG</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="exportBitmap('jpg')">导出 JPG</button>
      </div>

      <div class="mermaid-workbench" id="mermaidWorkbench">
        <div class="mermaid-editor-pane" id="editorPane">
          <div class="tool-pane-header">
            <span>Mermaid 代码</span>
            <div>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="ToolsCommon.copyText(document.getElementById('mermaidInput').value, '代码')">复制</button>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="clearCode()">清空</button>
            </div>
          </div>
          <textarea id="mermaidInput" class="tool-textarea" spellcheck="false" placeholder="在此输入 Mermaid 语法，支持 Tab 缩进..."></textarea>
        </div>

        <div class="mermaid-resizer" id="mermaidResizer" title="拖拽调整宽度"></div>

        <div class="mermaid-preview-pane">
          <div class="tool-pane-header">
            <span>图表预览（滚轮缩放 / 按住拖拽平移）</span>
            <span id="renderMeta" class="tool-pane-meta">就绪</span>
          </div>
          <div id="mermaidCanvas" class="mermaid-canvas">
            <div id="mermaidStage" class="mermaid-stage">
              <div id="mermaidPreview"></div>
            </div>
            <div id="zoomLabel" class="mermaid-zoom-badge">100%</div>
          </div>
        </div>
      </div>

      <div id="mermaidStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="./js/mermaid.js"></script>
</body>
</html>
