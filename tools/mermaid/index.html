<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=3">
  <title>Mermaid 图表渲染 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <header class="mdui-appbar mdui-appbar-fixed">
    <div id="toolbar" class="mdui-toolbar mdui-color-theme">
      <button class="mdui-btn mdui-btn-icon" mdui-drawer="{target: '#sidebar', swipe: true}"><i class="iconfont icon-menu"></i></button>
      <a href="/" class="mdui-typo-headline">秘密花园</a>
      <a href="/tools/" class="header-subtitle mdui-typo-headline">工具箱</a>
      <div class="mdui-toolbar-spacer"></div>
    </div>
  </header>

  <aside id="sidebar" class="mdui-drawer">
    <div class="mdui-tab" mdui-tab>
      <a href="#sidebar-tab1" id="sidebartab" class="mdui-ripple mdui-tab-active">站点概览</a>
      <a href="#sidebar-tab2" id="sidebartab" class="mdui-ripple">工具导航</a>
    </div>
    <div id="sidebar-tab1" class="mdui-p-a-2">
      <div class="mdui-list">
        <a href="/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-home"></i></div><div class="mdui-list-item-content">主页</div></a>
        <a href="/tools/" class="mdui-list-item mdui-ripple mdui-list-item-active"><div class="mdui-list-item-icon"><i class="iconfont icon-tools"></i></div><div class="mdui-list-item-content">工具箱</div></a>
        <a href="/archives/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-archive"></i></div><div class="mdui-list-item-content">归档</div></a>
        <div class="mdui-list-item mdui-ripple">
          <div class="mdui-list-item-icon"><i class="iconfont icon-moon"></i></div>
          <div class="mdui-list-item-content">夜间模式</div>
          <label class="mdui-switch" id="darkmode"><input type="checkbox" id="nightmode_switch"/><i class="mdui-switch-icon"></i></label>
        </div>
      </div>
    </div>
    <div id="sidebar-tab2" class="mdui-p-a-2">
      <div class="mdui-list">
        <a href="/tools/json/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">JSON 格式化与转换</div></a>
        <a href="/tools/jsonpath/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">JSONPath 定位</div></a>
        <a href="/tools/excel/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">Excel / CSV 转 JSON</div></a>
        <a href="/tools/mermaid/" class="mdui-list-item mdui-ripple mdui-list-item-active"><div class="mdui-list-item-content">Mermaid 图表渲染</div></a>
        <a href="/tools/image/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">图片压缩与转换</div></a>
        <a href="/tools/uuid/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">UUID / 随机 ID 生成</div></a>
        <a href="/tools/codec/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">编解码与加密哈希</div></a>
        <a href="/tools/timestamp/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">时间戳与进制转换</div></a>
        <a href="/tools/regex/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">正则表达式测试</div></a>
        <a href="/tools/diff/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-content">文本 / JSON 对比</div></a>
      </div>
    </div>
    <div class="mdui-divider"></div>
  </aside>

  <main id="main-contain" class="mdui-container mdui-m-t-5">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span>Mermaid 图表渲染</span>
    </div>

    <div class="mdui-card tools-header-card">
      <h1>❖ Mermaid 图表渲染</h1>
      <p>实时渲染流程图、时序图、类图、状态图、ER 图、甘特图与饼图，支持切换主题、缩放与导出 SVG / PNG。</p>
    </div>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="renderMermaid()">立即渲染</button>
        <select id="themeSelect" class="tool-select" onchange="renderMermaid()" title="图表主题">
          <option value="default">默认主题</option>
          <option value="dark">暗黑主题</option>
          <option value="forest">森林主题</option>
          <option value="neutral">中性主题</option>
        </select>
        <select id="templateSelect" class="tool-select" onchange="applyTemplate(this.value)">
          <option value="">选择示例模板...</option>
          <option value="flowchart">流程图 (Flowchart)</option>
          <option value="sequence">时序图 (Sequence)</option>
          <option value="class">类图 (Class)</option>
          <option value="state">状态图 (State)</option>
          <option value="er">ER 实体关系图</option>
          <option value="gantt">甘特图 (Gantt)</option>
          <option value="pie">饼图 (Pie)</option>
        </select>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="zoomBy(-0.15)">缩小</button>
        <span id="zoomLabel" class="tool-pane-meta">100%</span>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="zoomBy(0.15)">放大</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="resetZoom()">重置</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="exportSvg()">导出 SVG</button>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="exportPng()">导出 PNG</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>Mermaid 代码</span>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="ToolsCommon.copyText(document.getElementById('mermaidInput').value, '代码')">复制代码</button>
          </div>
          <textarea id="mermaidInput" class="tool-textarea" style="min-height:420px;" spellcheck="false"></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>图表预览</span>
            <span id="renderMeta" class="tool-pane-meta">就绪</span>
          </div>
          <div id="mermaidPreview" class="mermaid-preview"></div>
        </div>
      </div>

      <div id="mermaidStatus" class="tool-status"></div>
    </div>
  </main>

  <footer id="footer" class="mdui-text-center mdui-m-t-5 mdui-p-b-2 mdui-p-t-4 mdui-color-theme">
    <div class="mdui-container"><div class="mdui-row"><span>&copy; 2015 - 2026 <span style="color:#d9333f" class="iconfont icon-heart"></span> xsgaaaa</span></div></div>
  </footer>

  <button id="gotop" class="mdui-fab mdui-fab-fixed mdui-fab-hide mdui-ripple mdui-color-teal" style="z-index:100;"><i class="iconfont icon-arrowup"></i></button>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="./js/mermaid.js"></script>
</body>
</html>
