<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持 JSON 校验、缩进格式化、压缩、转义、Key 排序、树形预览，以及转换为 TypeScript / Go Struct / URL 参数。">
  <title>JSON 格式化与转换 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">JSON 格式化与转换</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">{ }</div>
      <div class="page-head-text">
        <h1>JSON 格式化与转换</h1>
        <p>支持 JSON 校验、缩进格式化、压缩、转义、Key 排序、树形预览，以及转换为 TypeScript / Go Struct / URL 参数。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <select id="indentSelect" class="tool-select" title="缩进方式">
          <option value="2">2 空格缩进</option>
          <option value="4">4 空格缩进</option>
          <option value="tab">Tab 缩进</option>
        </select>
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="jsonFormat()">格式化</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonMinify()">压缩</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonSortKeys()">Key 排序</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonEscape()">转义</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonUnescape()">反转义</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonToTs()">转 TypeScript</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonToGo()">转 Go Struct</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonToQuery()">转 URL 参数</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="queryToJson()">URL 参数转 JSON</button>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="loadSample()">示例</button>
        <button class="mdui-btn mdui-ripple" onclick="clearAll()">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>输入区</span>
            <span id="inputMeta" class="tool-pane-meta">0 字符 · 0 行</span>
          </div>
          <textarea id="jsonInput" class="tool-textarea" spellcheck="false" placeholder="在此粘贴 JSON、转义后的 JSON 字符串，或 key=value&amp;... 参数"></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <div>
              <button id="tabTextBtn" class="mdui-btn mdui-btn-dense mdui-color-theme" onclick="switchOutTab('text')">文本结果</button>
              <button id="tabTreeBtn" class="mdui-btn mdui-btn-dense" onclick="switchOutTab('tree')">树形视图</button>
            </div>
            <div>
              <span id="outputMeta" class="tool-pane-meta" style="margin-right:8px;">0 字符 · 0 行</span>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyOutput()">复制</button>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="downloadOutput()">下载</button>
            </div>
          </div>
          <textarea id="jsonOutput" class="tool-textarea" spellcheck="false" readonly placeholder="转换结果将显示在这里"></textarea>
          <div id="jsonTree" class="json-tree" style="display:none;"></div>
        </div>
      </div>

      <div id="jsonStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/json.js"></script>
</body>
</html>
