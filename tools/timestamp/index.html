<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="实时 Unix 时间戳（秒 / 毫秒）与日期时间互转，支持常见时间偏移与任意进制转换（支持大整数）。">
  <title>时间戳与进制转换 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">时间戳与进制转换</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">◴</div>
      <div class="page-head-text">
        <h1>时间戳与进制转换</h1>
        <p>实时 Unix 时间戳（秒 / 毫秒）与日期时间互转，支持常见时间偏移与任意进制转换（支持大整数）。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <strong>当前时间</strong>
        <span id="nowSec" class="tool-input" style="min-width:120px;text-align:center;">-</span>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="ToolsCommon.copyText(document.getElementById('nowSec').textContent, '秒级时间戳')">复制(秒)</button>
        <span id="nowMs" class="tool-input" style="min-width:150px;text-align:center;">-</span>
        <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="ToolsCommon.copyText(document.getElementById('nowMs').textContent, '毫秒时间戳')">复制(毫秒)</button>
        <span id="nowLocal" class="tool-pane-meta"></span>
        <div class="tool-toolbar-spacer"></div>
        <button id="pauseBtn" class="mdui-btn mdui-btn-raised mdui-ripple" onclick="togglePause()">暂停</button>
      </div>

      <div class="tool-split" style="margin-top:16px;">
        <div class="tool-pane">
          <div class="tool-pane-header"><span>时间戳 → 日期时间</span></div>
          <div class="tool-toolbar">
            <input id="tsInput" class="tool-input" style="flex:1;" placeholder="输入 10位(秒) 或 13位(毫秒) 时间戳">
            <select id="tsUnit" class="tool-select">
              <option value="auto">自动识别</option>
              <option value="s">秒 (s)</option>
              <option value="ms">毫秒 (ms)</option>
            </select>
            <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="convertTsToDate()">转换</button>
          </div>
          <div class="tool-toolbar">
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="fillNowTs()">当前</button>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="offsetTs(-86400)">-1 天</button>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="offsetTs(3600)">+1 小时</button>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="offsetTs(86400)">+1 天</button>
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="offsetTs(604800)">+7 天</button>
          </div>
          <div id="tsResult" class="tool-kv-grid" style="grid-template-columns:1fr;"></div>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header"><span>日期时间 → 时间戳</span></div>
          <div class="tool-toolbar">
            <input id="dateInput" class="tool-input" style="flex:1;" placeholder="例如: 2026-11-20 08:00:00 或 ISO 格式">
            <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="convertDateToTs()">转换</button>
          </div>
          <div class="tool-toolbar">
            <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="fillNowDate()">填入当前时间</button>
          </div>
          <div id="dateResult" class="tool-kv-grid" style="grid-template-columns:1fr;"></div>
        </div>
      </div>
      <div id="tsStatus" class="tool-status"></div>
    </div>

    <div class="mdui-card tool-panel">
      <div class="tool-pane-header" style="margin-bottom:12px;"><span style="font-size:16px;">进制转换 (2 / 8 / 10 / 16 / 36 进制)</span></div>
      <div class="tool-toolbar">
        <input id="baseInput" class="tool-input" style="flex:1;min-width:200px;" placeholder="输入整数，例如 255、0xff、101010" oninput="convertBase()">
        <select id="baseFrom" class="tool-select" onchange="convertBase()">
          <option value="10">十进制 (10)</option>
          <option value="16">十六进制 (16)</option>
          <option value="2">二进制 (2)</option>
          <option value="8">八进制 (8)</option>
          <option value="36">三十六进制 (36)</option>
        </select>
      </div>
      <div class="tool-kv-grid">
        <div class="tool-kv-item"><div class="tool-kv-label">二进制 (Bin)</div><div id="base2" class="tool-kv-value">-</div></div>
        <div class="tool-kv-item"><div class="tool-kv-label">八进制 (Oct)</div><div id="base8" class="tool-kv-value">-</div></div>
        <div class="tool-kv-item"><div class="tool-kv-label">十进制 (Dec)</div><div id="base10" class="tool-kv-value">-</div></div>
        <div class="tool-kv-item"><div class="tool-kv-label">十六进制 (Hex)</div><div id="base16" class="tool-kv-value">-</div></div>
        <div class="tool-kv-item"><div class="tool-kv-label">三十六进制 (Base36)</div><div id="base36" class="tool-kv-value">-</div></div>
      </div>
      <div id="baseStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/timestamp.js"></script>
</body>
</html>
