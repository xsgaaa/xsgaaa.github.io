<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持 SQL 美化缩进、单行压缩，以及一键将 MyBatis 控制台的 Preparing + Parameters 日志还原为可直接执行的 SQL。">
  <title>SQL 格式化与 MyBatis 日志还原 - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">SQL 格式化 &amp; MyBatis 还原</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">SQL</div>
      <div class="page-head-text">
        <h1>SQL 格式化 &amp; MyBatis 日志还原</h1>
        <p>支持 SQL 美化缩进、单行压缩，以及一键将 MyBatis 控制台的 Preparing + Parameters 日志还原为可直接执行的 SQL。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <button class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" onclick="restoreMyBatis()">MyBatis 日志还原</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="formatSql()">SQL 格式化</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="minifySql()">SQL 压缩</button>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="loadSampleMyBatis()">MyBatis 示例</button>
        <button class="mdui-btn mdui-ripple" onclick="clearAll()">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>输入区（原始 SQL 或 MyBatis 日志）</span>
            <span id="sqlInMeta" class="tool-pane-meta">0 字符</span>
          </div>
          <textarea id="sqlInput" class="tool-textarea" spellcheck="false" placeholder="粘贴 SQL 语句，或包含 ==>  Preparing: ... 和 ==> Parameters: ... 的 MyBatis 日志"></textarea>
        </div>
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>结果区</span>
            <div>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyOut()">复制</button>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="downloadOut()">下载 .sql</button>
            </div>
          </div>
          <textarea id="sqlOutput" class="tool-textarea" spellcheck="false" readonly placeholder="处理后的 SQL 将显示在这里"></textarea>
        </div>
      </div>

      <div id="sqlStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="./js/sql.js"></script>
</body>
</html>
