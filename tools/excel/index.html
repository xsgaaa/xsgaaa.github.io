<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="支持上传 .xlsx / .xls / .csv 文件或直接从 Excel 复制粘贴表格数据，也支持将 JSON 数组导出为 Excel / CSV。">
  <title>Excel / CSV 转 JSON - 开发者工具箱</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <a class="t-skip-link" href="#main-contain">跳到主内容</a>

  <main id="main-contain" class="mdui-container" data-shell="tools">
    <div class="tools-breadcrumb">
      <a href="/">首页</a><span>/</span><a href="/tools/">工具箱</a><span>/</span><span aria-current="page">Excel / CSV 转 JSON</span>
    </div>

    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">⊞</div>
      <div class="page-head-text">
        <h1>Excel / CSV 转 JSON</h1>
        <p>支持上传 .xlsx / .xls / .csv 文件或直接从 Excel 复制粘贴表格数据，也支持将 JSON 数组导出为 Excel / CSV。</p>
      </div>
    </header>

    <div class="mdui-card tool-panel">
      <div class="tool-toolbar">
        <label class="mdui-btn mdui-btn-raised mdui-color-theme mdui-ripple" style="cursor:pointer;">
          选择 Excel / CSV 文件
          <input id="excelFile" type="file" accept=".xlsx,.xls,.csv,.tsv" style="display:none;">
        </label>
        <select id="sheetSelect" class="tool-select" style="display:none;" onchange="renderCurrentSheet()"></select>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="parsePastedText()">文本转 JSON</button>
        <button class="mdui-btn mdui-btn-raised mdui-ripple" onclick="jsonToExcel()">JSON 导出 Excel</button>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="hasHeader" checked onchange="reprocess()"> 首行为表头</label>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="trimCells" checked onchange="reprocess()"> 去除空白</label>
        <label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="minifyJson" onchange="reprocess()"> 压缩 JSON</label>
        <div class="tool-toolbar-spacer"></div>
        <button class="mdui-btn mdui-ripple" onclick="loadSample()">示例</button>
        <button class="mdui-btn mdui-ripple" onclick="clearAll()">清空</button>
      </div>

      <div class="tool-split">
        <div class="tool-pane">
          <div class="tool-pane-header">
            <span>粘贴表格文本 (CSV / TSV) 或 JSON 数组</span>
            <span id="fileMeta" class="tool-pane-meta">未选择文件</span>
          </div>
          <textarea id="rawInput" class="tool-textarea" spellcheck="false" placeholder="可直接从 Excel 复制单元格粘贴到此处（Tab 分隔），或粘贴 CSV 文本，或粘贴 JSON 数组点击「JSON 导出 Excel」"></textarea>
        </div>

        <div class="tool-pane">
          <div class="tool-pane-header">
            <div>
              <button id="tabJsonBtn" class="mdui-btn mdui-btn-dense mdui-color-theme" onclick="switchTab('json')">JSON 结果</button>
              <button id="tabTableBtn" class="mdui-btn mdui-btn-dense" onclick="switchTab('table')">表格预览</button>
            </div>
            <div>
              <span id="rowMeta" class="tool-pane-meta" style="margin-right:8px;">0 条记录</span>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="copyJson()">复制</button>
              <button class="mdui-btn mdui-btn-dense mdui-ripple" onclick="downloadJson()">下载 JSON</button>
            </div>
          </div>
          <textarea id="jsonOutput" class="tool-textarea" spellcheck="false" readonly placeholder="转换后的 JSON 将显示在这里"></textarea>
          <div id="tablePreview" class="tool-table-wrap" style="display:none;"></div>
        </div>
      </div>

      <div id="excelStatus" class="tool-status"></div>
    </div>
  </main>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./js/excel.js"></script>
</body>
</html>
