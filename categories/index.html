<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-siteapp">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/css/mdui.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/iconfont.css">
  <link rel="stylesheet" href="/css/tools.css?v=12">
  <meta name="description" content="站点内容分类索引。">
  <title>分类 - xsgaaaa 的工作台</title>
</head>
<body class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-blue">
  <header class="mdui-appbar mdui-appbar-fixed">
    <div id="toolbar" class="mdui-toolbar mdui-color-theme">
      <button class="mdui-btn mdui-btn-icon" mdui-drawer="{target: '#sidebar', swipe: true}"><i class="iconfont icon-menu"></i></button>
      <a href="/" class="mdui-typo-headline">xsgaaaa 的工作台</a>
      <a href="/categories/" class="header-subtitle mdui-typo-headline">分类</a>
      <div class="mdui-toolbar-spacer"></div>
      <button class="mdui-btn mdui-btn-icon" mdui-dialog="{target: '#search'}" mdui-tooltip="{content: 'search'}"><i class="iconfont icon-search"></i></button>
    </div>
  </header>

  <div class="mdui-dialog" id="search">
    <div class="search-form"><input type="search" class="search-form-input" placeholder="请输入关键字" onfocus="listenSearchFunc()"></div>
    <div class="search-result" data-resource="/search.xml"></div>
  </div>

  <aside id="sidebar" class="mdui-drawer">
    <div class="mdui-tab" mdui-tab>
      <a href="#sidebar-tab1" id="sidebartab" class="mdui-ripple mdui-tab-active">站点概览</a>
      <a href="#sidebar-tab2" id="sidebartab" class="mdui-ripple">全部工具</a>
    </div>
    <div id="sidebar-tab1" class="mdui-p-a-2">
      <div class="mdui-list">
        <a href="/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-home"></i></div><div class="mdui-list-item-content">主页</div></a>
        <a href="/tags/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-bookmark"></i></div><div class="mdui-list-item-content">标签</div></a>
        <a href="/categories/" class="mdui-list-item mdui-ripple mdui-list-item-active"><div class="mdui-list-item-icon"><i class="iconfont icon-folder"></i></div><div class="mdui-list-item-content">分类</div></a>
        <a href="/archives/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-archive"></i></div><div class="mdui-list-item-content">归档</div></a>
        <a href="/tools/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-tools"></i></div><div class="mdui-list-item-content">工具箱</div></a>
        <a href="/about/" class="mdui-list-item mdui-ripple"><div class="mdui-list-item-icon"><i class="iconfont icon-user"></i></div><div class="mdui-list-item-content">关于</div></a>
        <div class="mdui-list-item mdui-ripple">
          <div class="mdui-list-item-icon"><i class="iconfont icon-moon"></i></div>
          <div class="mdui-list-item-content">夜间模式</div>
          <label class="mdui-switch" id="darkmode"><input type="checkbox" id="nightmode_switch"/><i class="mdui-switch-icon"></i></label>
        </div>
      </div>
    </div>
    <div id="sidebar-tab2" class="mdui-p-a-2"><div class="mdui-list"></div></div>
    <div class="mdui-divider"></div>
  </aside>

  <main id="main-contain" class="mdui-container mdui-m-t-5">
    <nav class="tools-breadcrumb" aria-label="面包屑"><a href="/">首页</a><span>/</span><span aria-current="page">分类</span></nav>
    <header class="tools-header-card">
      <div class="page-head-glyph" aria-hidden="true">▥</div>
      <div class="page-head-text">
        <h1>文章分类</h1>
        <p>站点内容分类索引。</p>
      </div>
    </header>
    <div class="mdui-card tool-panel" style="padding:24px;">
      <div class="mdui-list">
        <a href="/2020/08/03/leetcode/" class="mdui-list-item mdui-ripple">
          <div class="mdui-list-item-icon"><i class="iconfont icon-folder"></i></div>
          <div class="mdui-list-item-content">算法与刷题笔记（1 篇）</div>
        </a>
        <a href="/2020/08/03/hello-world/" class="mdui-list-item mdui-ripple">
          <div class="mdui-list-item-icon"><i class="iconfont icon-folder"></i></div>
          <div class="mdui-list-item-content">博客随笔（1 篇）</div>
        </a>
        <a href="/tools/" class="mdui-list-item mdui-ripple">
          <div class="mdui-list-item-icon"><i class="iconfont icon-tools"></i></div>
          <div class="mdui-list-item-content">开发者效率工具箱（18 款）</div>
        </a>
      </div>
    </div>
  </main>

  <footer id="footer" class="mdui-text-center mdui-m-t-5 mdui-p-b-2 mdui-p-t-4 mdui-color-theme">
    <div class="mdui-container"><div class="mdui-row"><span>&copy; 2015 - 2026 <span style="color:#d9333f" class="iconfont icon-heart"></span> xsgaaaa</span></div></div>
  </footer>
  <button id="gotop" class="mdui-fab mdui-fab-fixed mdui-fab-hide mdui-ripple mdui-color-teal" style="z-index:100;"><i class="iconfont icon-arrowup"></i></button>

  <script src="/js/mdui.min.js"></script>
  <script src="/js/meadow.js"></script>
  <script src="/js/tools-common.js?v=12"></script>
</body>
</html>
